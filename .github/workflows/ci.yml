name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 같은 PR에 새 커밋이 푸시되면 이전 실행은 취소 — Actions 사용 시간 절약
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # tsc -b 포함 — 프로젝트의 진짜 게이트
      - name: Build
        run: npm run build
